<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Deep Navy Background -->
  <rect width="100%" height="100%" fill="#050c30" />

  <!-- Circuit Shield Icon Group -->
  <g stroke="#ff5500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Outer Shield Frame Left -->
    <path d="M 235 125 L 195 125 L 175 155 L 205 215 L 225 215 L 245 255 L 250 255" />
    
    <!-- Outer Shield Frame Right -->
    <path d="M 265 125 L 305 125 L 325 155 L 295 215 L 285 215 L 255 255" />
    
    <!-- Inner Circuit Branches -->
    <path d="M 195 155 L 225 215" />
    <path d="M 250 150 L 300 150 L 265 215" />
    <path d="M 235 250 L 275 175" />

    <!-- Nodes / Circles (Fill matches background, stroke is orange) -->
    <g fill="#050c30" stroke="#ff5500" stroke-width="4">
      <!-- Top Row -->
      <circle cx="235" cy="125" r="7" />
      <circle cx="265" cy="125" r="7" />
      <circle cx="195" cy="125" r="7" />
      <circle cx="305" cy="125" r="7" />
      
      <!-- Upper Mid -->
      <circle cx="175" cy="155" r="7" />
      <circle cx="325" cy="155" r="7" />
      <circle cx="250" cy="150" r="7" />
      
      <!-- Lower Mid -->
      <circle cx="205" cy="215" r="7" />
      <circle cx="295" cy="215" r="7" />
      <circle cx="265" cy="215" r="7" />
      <circle cx="275" cy="175" r="7" />
      
      <!-- Bottom Triangle Area -->
      <circle cx="225" cy="215" r="7" />
      <circle cx="285" cy="215" r="7" />
      <circle cx="250" cy="255" r="7" />
    </g>
  </g>

  <!-- Typography -->
  <!-- AGENTIX (Bold White) -->
  <text x="250" y="340" fill="#ffffff" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="42" font-weight="900" text-anchor="middle" letter-spacing="3">AGENTIX</text>
  
  <!-- SINCE 2026 (Spaced Orange) -->
  <text x="250" y="375" fill="#ff5500" font-family="'Montserrat', 'Arial', sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="8">SINCE 2026</text>
</svg>
